name: Native Qwen Governance Benchmark

on:
  workflow_dispatch:
    inputs:
      model_profile:
        description: "Pinned native Qwen model, parser, and accelerator profile."
        required: true
        type: choice
        options:
          - qwen3-coder-30b-fp8
          - qwen3.6-27b-fp8
          - qwen3.6-35b-a3b-fp8
        default: qwen3.6-27b-fp8
      experiment_set:
        description: "Select the bounded native-parser controller cells to execute."
        required: true
        type: choice
        options:
          - atomic-and-scoped
          - atomic-only
          - required-only
          - milestone-packets
          - milestone-patch-only
          - milestone-authority-only
          - milestone-authority-v2-only
          - hybrid-v2-only
        default: atomic-and-scoped
      repetitions:
        description: "Matched repetitions; promote from 1 to 5 to 10 only after passing."
        required: true
        type: choice
        options:
          - "1"
          - "5"
          - "10"
        default: "1"
      deploy_timeout_seconds:
        description: "Hard deployment deadline."
        required: false
        default: "1200"
      request_timeout_seconds:
        description: "Hard deadline for each model request."
        required: false
        default: "120"
      cell_timeout_seconds:
        description: "Hard deadline for each benchmark cell."
        required: false
        default: "900"
      run_timeout_seconds:
        description: "Hard deadline for the complete bounded experiment."
        required: true
        type: choice
        options:
          - "1800"
          - "3600"
          - "5400"
        default: "3600"

permissions: {}

env:
  SPECSMITH_NO_AUTO_UPDATE: "1"
  SPECSMITH_PYPI_CHECKED: "1"
  SPECSMITH_ALLOW_NON_PIPX: "1"
  NATIVE_QWEN_MODEL: "Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
  NATIVE_QWEN_IMAGE: "vllm/vllm-openai:v0.24.0"
  NATIVE_QWEN_TOOL_PARSER: "qwen3_xml"
  NATIVE_QWEN_INSTANCE_TYPE: "nvidia-l40s"
  NATIVE_QWEN_INSTANCE_SIZE: "x1"
  NATIVE_QWEN_MAX_MODEL_LEN: "32768"
  NATIVE_QWEN_HOURLY_COST_USD: "1.80"
  NATIVE_QWEN_TASK: "T28"
  NATIVE_QWEN_LANGUAGE_MODEL_ONLY: "false"

jobs:
  native-qwen:
    name: ${{ inputs.model_profile }} / native parser
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned endpoint and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "huggingface_hub==1.25.1" openai

      - name: Install demo-project dependencies
        run: python scripts/govern_bench/install_demo_deps.py

      - name: Select the pinned native Qwen profile
        shell: bash
        run: |
          case "${{ inputs.model_profile }}" in
            qwen3-coder-30b-fp8)
              {
                echo "NATIVE_QWEN_MODEL=Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8"
                echo "NATIVE_QWEN_TOOL_PARSER=qwen3_xml"
                echo "NATIVE_QWEN_REASONING_PARSER="
                echo "NATIVE_QWEN_INSTANCE_TYPE=nvidia-l40s"
                echo "NATIVE_QWEN_HOURLY_COST_USD=1.80"
                echo "NATIVE_QWEN_TASK=T28"
                echo "NATIVE_QWEN_LANGUAGE_MODEL_ONLY=false"
              } >> "$GITHUB_ENV"
              ;;
            qwen3.6-27b-fp8)
              {
                echo "NATIVE_QWEN_MODEL=Qwen/Qwen3.6-27B-FP8"
                echo "NATIVE_QWEN_TOOL_PARSER=qwen3_coder"
                echo "NATIVE_QWEN_REASONING_PARSER=qwen3"
                echo "NATIVE_QWEN_INSTANCE_TYPE=nvidia-a100"
                echo "NATIVE_QWEN_HOURLY_COST_USD=2.50"
                echo "NATIVE_QWEN_TASK=T29"
                echo "NATIVE_QWEN_LANGUAGE_MODEL_ONLY=true"
              } >> "$GITHUB_ENV"
              ;;
            qwen3.6-35b-a3b-fp8)
              {
                echo "NATIVE_QWEN_MODEL=Qwen/Qwen3.6-35B-A3B-FP8"
                echo "NATIVE_QWEN_TOOL_PARSER=qwen3_coder"
                echo "NATIVE_QWEN_REASONING_PARSER=qwen3"
                echo "NATIVE_QWEN_INSTANCE_TYPE=nvidia-a100"
                echo "NATIVE_QWEN_HOURLY_COST_USD=2.50"
                echo "NATIVE_QWEN_TASK=T29"
                echo "NATIVE_QWEN_LANGUAGE_MODEL_ONLY=true"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported native Qwen profile."
              exit 2
              ;;
          esac

      - name: Deploy and prove the native Qwen parser
        id: endpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ENDPOINT_NAME="specsmith-qwen-native-${{ github.run_id }}"
          deploy_args=(
            --name "$ENDPOINT_NAME"
            --output native-endpoint.json
            --model "$NATIVE_QWEN_MODEL"
            --image "$NATIVE_QWEN_IMAGE"
            --tool-parser "$NATIVE_QWEN_TOOL_PARSER"
            --instance-type "$NATIVE_QWEN_INSTANCE_TYPE"
            --instance-size "$NATIVE_QWEN_INSTANCE_SIZE"
            --max-model-len "$NATIVE_QWEN_MAX_MODEL_LEN"
            --hourly-cost-usd "$NATIVE_QWEN_HOURLY_COST_USD"
            --deploy-timeout-s "${{ inputs.deploy_timeout_seconds }}"
            --probe-timeout-s "${{ inputs.request_timeout_seconds }}"
          )
          if [ -n "${NATIVE_QWEN_REASONING_PARSER:-}" ]; then
            deploy_args+=(--reasoning-parser "$NATIVE_QWEN_REASONING_PARSER")
          fi
          if [ "$NATIVE_QWEN_LANGUAGE_MODEL_ONLY" = "true" ]; then
            deploy_args+=(--language-model-only)
          fi
          python scripts/govern_bench/native_endpoint.py deploy "${deploy_args[@]}"
          echo "name=$ENDPOINT_NAME" >> "$GITHUB_OUTPUT"
          echo "base_url=$(jq -r '.base_url' native-endpoint.json)" >> "$GITHUB_OUTPUT"

      - name: Run bounded native-parser controller experiments
        id: benchmark
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BENCH_OPENAI_COMPAT_API_KEY: ${{ secrets.HF_TOKEN }}
          BENCH_OPENAI_BASE_URL: ${{ steps.endpoint.outputs.base_url }}
          BENCH_REQUEST_TIMEOUT_S: ${{ inputs.request_timeout_seconds }}
          BENCH_CELL_TIMEOUT_S: ${{ inputs.cell_timeout_seconds }}
          BENCH_PROVIDER_MAX_RETRIES: "0"
          BENCH_MAX_TURNS: "12"
        run: |
          if [ "${{ inputs.experiment_set }}" = "milestone-packets" ]; then
            EXPERIMENTS="scalar-milestone-packet scalar-milestone-packet-adaptive"
          elif [ "${{ inputs.experiment_set }}" = "hybrid-v2-only" ]; then
            EXPERIMENTS="scalar-parallel-hybrid-v2"
          elif [ "${{ inputs.experiment_set }}" = "milestone-authority-v2-only" ]; then
            EXPERIMENTS="scalar-milestone-packet-authority-v2"
          elif [ "${{ inputs.experiment_set }}" = "milestone-authority-only" ]; then
            EXPERIMENTS="scalar-milestone-packet-authority"
          elif [ "${{ inputs.experiment_set }}" = "milestone-patch-only" ]; then
            EXPERIMENTS="scalar-milestone-packet-patch"
          elif [ "${{ inputs.experiment_set }}" = "required-only" ]; then
            EXPERIMENTS="scalar-native-patch-scoped-required"
          else
            EXPERIMENTS="scalar-native-patch"
          fi
          if [ "${{ inputs.experiment_set }}" = "atomic-and-scoped" ]; then
            EXPERIMENTS="$EXPERIMENTS scalar-native-patch-scoped"
          fi

          overall=0
          : > native-run-status.tsv
          for experiment in $EXPERIMENTS; do
            set +e
            timeout --signal=TERM "${{ inputs.run_timeout_seconds }}s" \
              env BENCH_CONTROLLER_EXPERIMENT="$experiment" \
              python scripts/govern_bench/run_bench.py \
                --profile custom \
                --task "$NATIVE_QWEN_TASK" \
                --condition SPECSMITH_FULL \
                --reps "${{ inputs.repetitions }}" \
                --provider openai-compat \
                --base-url "$BENCH_OPENAI_BASE_URL" \
                --model "$NATIVE_QWEN_MODEL" \
                --output "bench-report-$experiment.md" \
                --json-output "bench-results-$experiment.json"
            status=$?
            set -e
            printf '%s\t%s\n' "$experiment" "$status" >> native-run-status.tsv
            if [ "$status" -ne 0 ]; then
              overall=1
            fi
          done
          exit "$overall"

      - name: Pause and delete the ephemeral endpoint
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/govern_bench/native_endpoint.py cleanup \
            --name "specsmith-qwen-native-${{ github.run_id }}" \
            --deployment-receipt native-endpoint.json \
            --output native-endpoint-cleanup.json

      - name: Upload native parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-qwen-${{ github.run_id }}
          path: |
            native-endpoint.json
            native-endpoint-cleanup.json
            native-run-status.tsv
            bench-report-*.md
            bench-results-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Fail closed on benchmark errors
        if: always() && steps.endpoint.outcome == 'success' && steps.benchmark.outcome != 'success'
        run: |
          echo "::error::One or more native Qwen benchmark cells failed or timed out."
          exit 1
