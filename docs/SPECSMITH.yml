# SPDX-License-Identifier: MIT
# Specsmith - lean governance for AI-assisted development

name: specsmith
description: |
  Specsmith tracks requirements and linked tests, enforces preflight and
  verification, compresses epistemic context, and records auditable evidence
  around the coding agents and developer tools a project already uses.

type: python
version: 0.25.0
# Governance schema/tool version that last generated or migrated this project.
# This is intentionally distinct from the package/project release version above.
spec_version: 0.25.0
license: MIT
author: Layer1 Labs
url: https://github.com/layer1labs/specsmith

aee_phase: release

# This repository's ledger uses longer evidence-rich entries. Its 64 structured
# entries are below the 300-entry compression floor, so use the supported
# per-project limit instead of suppressing the ledger-size audit.
ledger_line_threshold: 750
