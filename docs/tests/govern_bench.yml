    governed cell is a correctness blocker even without a baseline condition. The
    audit selects a machine-readable reject, repair, optimize, advance-candidate,
    repeat, or publish action from the same evidence and validates any frontier
    envelope before using it.
  requirement_id: REQ-490
  type: integration
  verification_method: pytest tests/test_benchmark_audit.py tests/test_govern_bench_integrity.py tests/test_benchmark_harness.py
  input: T28 and fresh-repository fixtures plus complete, incomplete, and verification-disagreement result artifacts
  expected_behavior: No-op long-horizon work fails and post-run reports expose actionable weaknesses without an LLM judge
  confidence: 1.0
