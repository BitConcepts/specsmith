- id: TEST-516
  title: Long-horizon polyglot task and benchmark weakness audit
  description: >-
    Tests verify T28 and an independent fresh-repository task have 20-turn
    polyglot UI scopes and separate evaluator-only oracles that reject their
    clean starters; benchmark artifacts automatically produce a
    deterministic weakness audit; and specsmith audit combines project health with
